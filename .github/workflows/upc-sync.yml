name: Finalize UPC v0.2.12 main sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/upc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct validated source package
        shell: bash
        run: |
          set -euo pipefail
          cat .upc-sync/part00 .upc-sync/part01 .upc-sync/part02 .upc-sync/part03 .upc-sync/part04 | base64 -d > /tmp/upc.zip
          unzip -t /tmp/upc.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .upc-sync ! -name .gitignore -exec rm -rf {} +
          unzip -oq /tmp/upc.zip -d .
          rm -rf .upc-sync
          rm -f .github/workflows/upc-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit validated v0.2.12 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote validated UPC v0.2.12 to main'
          git push origin main
