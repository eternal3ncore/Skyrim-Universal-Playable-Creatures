name: UPC source sync

on:
  push:
    branches: [main]
    paths:
      - '.upc-sync/**'
      - '.github/workflows/upc-source-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .upc-sync/plugin.gz.b64 | gzip -dc > src/plugin.cpp
          cat .upc-sync/ucc_core.part0 .upc-sync/ucc_core.part1 | base64 -d | gzip -dc > src/ucc_core.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.cpp src/ucc_core.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote UPC v0.2.13 source"
          git push origin HEAD:main
